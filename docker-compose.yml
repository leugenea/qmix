name: agent-apps

services:
  backend:
    build:
      context: .
      args:
        VERSION: "${VERSION:?compute build metadata first}"
        COMMIT: "${COMMIT:?compute build metadata first}"
        DIRTY: "${DIRTY:?compute build metadata first}"
        ANDROID_VERSION_CODE: "${ANDROID_VERSION_CODE:?compute build metadata first}"
    ports:
      - "8180:8080"
    environment:
      QMIX_ADDR: ":8080"
      # Proxy passthrough for environments where YouTube is reachable only
      # via a proxy: yt-dlp and the audio proxy both honor these. Empty by
      # default.
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-}"
    restart: on-failure:3
    mem_limit: 512m
