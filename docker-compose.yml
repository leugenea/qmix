name: agent-apps

services:
  backend:
    image: "qmix:${QMIX_IMAGE_TAG:-local}"
    build:
      context: .
      args:
        VERSION: "${VERSION:?compute build metadata first}"
        COMMIT: "${COMMIT:?compute build metadata first}"
        DIRTY: "${DIRTY:?compute build metadata first}"
        ANDROID_VERSION_CODE: "${ANDROID_VERSION_CODE:?compute build metadata first}"
    ports:
      - "8180:8080"
    group_add:
      - "${QMIX_LOG_GID:?run make compose-up}"
    environment:
      QMIX_ADDR: ":8080"
      QMIX_LOG_LEVEL: "${QMIX_LOG_LEVEL:-warn}"
      QMIX_LOG_FILE: "/var/log/qmix/qmix.log"
      QMIX_YTDLP_METADATA_TIMEOUT: "${QMIX_YTDLP_METADATA_TIMEOUT:-30s}"
      QMIX_YTDLP_SEARCH_TIMEOUT: "${QMIX_YTDLP_SEARCH_TIMEOUT:-60s}"
      # Shared yt-dlp subprocess capacity (qmix#130): at most
      # QMIX_YTDLP_MAX_CONCURRENT subprocesses run at once, with up to
      # QMIX_YTDLP_QUEUE_LIMIT requests waiting; further requests are
      # rejected with 503 and Retry-After.
      QMIX_YTDLP_MAX_CONCURRENT: "${QMIX_YTDLP_MAX_CONCURRENT:-2}"
      QMIX_YTDLP_QUEUE_LIMIT: "${QMIX_YTDLP_QUEUE_LIMIT:-8}"
      # Per-client POST /rooms token bucket (qmix#155). Forwarding headers are
      # ignored unless the direct peer is listed explicitly as a trusted proxy.
      # Safe ranges: rate 1..60000/minute, burst 1..10000, and retained
      # identities 1..65536. Out-of-range values fail startup; none are clamped.
      QMIX_ROOM_CREATE_RATE_PER_MINUTE: "${QMIX_ROOM_CREATE_RATE_PER_MINUTE:-10}"
      QMIX_ROOM_CREATE_BURST: "${QMIX_ROOM_CREATE_BURST:-5}"
      QMIX_ROOM_CREATE_IDENTITY_LIMIT: "${QMIX_ROOM_CREATE_IDENTITY_LIMIT:-4096}"
      QMIX_TRUSTED_PROXY_CIDRS: "${QMIX_TRUSTED_PROXY_CIDRS:-}"
      # One token bucket per room incarnation, shared by both queue aliases
      # (qmix#156). Safe ranges match the bounded rate and burst domains above.
      QMIX_ROOM_SUBMISSION_RATE_PER_MINUTE: "${QMIX_ROOM_SUBMISSION_RATE_PER_MINUTE:-30}"
      QMIX_ROOM_SUBMISSION_BURST: "${QMIX_ROOM_SUBMISSION_BURST:-10}"
      # Process-wide live-room bound (qmix#157). Expiry releases slots.
      QMIX_MAX_LIVE_ROOMS: "${QMIX_MAX_LIVE_ROOMS:-256}"
      # Proxy passthrough for environments where YouTube is reachable only
      # via a proxy: yt-dlp and the audio proxy both honor these. Empty by
      # default.
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-}"
    volumes:
      - type: bind
        source: ./agent-apps-data/qmix/logs
        target: /var/log/qmix
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: on-failure:3
    mem_limit: 512m
