name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.paths.outputs.android }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: paths
        name: Route changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            printf 'ci=true\nandroid=true\nlive=true\n' >> "$GITHUB_OUTPUT"
          elif git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"; then
            python3 .github/scripts/workflow_paths.py \
              < "$RUNNER_TEMP/changed-paths" >> "$GITHUB_OUTPUT"
          else
            printf 'ci=true\nandroid=true\nlive=true\n' >> "$GITHUB_OUTPUT"
          fi

  android-build:
    needs: route
    if: needs.route.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build, lint, and JVM tests
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qmix-tv-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload JVM and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-build-reports
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: error

  android-tv-instrumentation:
    needs: route
    if: needs.route.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      TV_API_LEVEL: "36"
      TV_SYSTEM_IMAGE: android-tv
      TV_ARCH: x86
      TV_DEVICE_PROFILE: tv_1080p
      AVD_NAME: qmixtv
      AVD_SNAPSHOT_NAME: qmix-ci
      AVD_PREP_REVISION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Mark AVD setup start
        run: |
          mkdir -p android/app/build/reports
          date +%s > "$RUNNER_TEMP/qmix-avd-setup-start"
      - name: Free disk space for TV emulator
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/.ghcup \
            /opt/ghc \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/ndk
          available_kb=$(df --output=avail -k / | { read -r _; read -r kb; printf '%s\n' "$kb"; })
          if (( available_kb < 15728640 )); then
            echo "Expected at least 15 GiB free for the TV system image; found ${available_kb} KiB" >&2
            df -h /
            exit 1
          fi
          df -h /
      - name: Install Android TV emulator SDK
        run: |
          sdkmanager \
            "platforms;android-$TV_API_LEVEL" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-$TV_API_LEVEL;$TV_SYSTEM_IMAGE;$TV_ARCH"
      - id: avd-key
        name: Resolve AVD compatibility key
        env:
          RUNNER_OS_KEY: ${{ runner.os }}
          RUNNER_ARCH_KEY: ${{ runner.arch }}
        run: |
          version=$("$ANDROID_HOME/emulator/emulator" -version 2>&1 \
            | awk '/Android emulator version / {for (i=1; i<=NF; i++) if ($i == "version") {print $(i+1); exit}}')
          printf 'Emulator version candidate: <%q>\n' "$version"
          [[ "$version" =~ ^[0-9]+([.][0-9]+)*$ ]]
          image_package="$ANDROID_HOME/system-images/android-$TV_API_LEVEL/$TV_SYSTEM_IMAGE/$TV_ARCH/source.properties"
          image_revision=$(awk -F= '$1 == "Pkg.Revision" {print $2; exit}' "$image_package")
          printf 'System image revision candidate: <%q>\n' "$image_revision"
          [[ "$image_revision" =~ ^[0-9]+([.][0-9]+)*$ ]]
          printf 'Resolved emulator=%s image=%s\n' "$version" "$image_revision"
          . /etc/os-release
          host_os="${ID}-${VERSION_ID}"
          key="avd-${RUNNER_OS_KEY}-${RUNNER_ARCH_KEY}-${host_os}-${AVD_NAME}-${AVD_SNAPSHOT_NAME}-api${TV_API_LEVEL}-${TV_SYSTEM_IMAGE}-${TV_ARCH}-${TV_DEVICE_PROFILE}-img${image_revision}-emu${version}-prep${AVD_PREP_REVISION}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'image-revision=%s\nkey=%s\n' "$image_revision" "$key" >> "$GITHUB_OUTPUT"
      - id: avd-cache
        name: Restore Android TV AVD snapshot
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.android/avd/${{ env.AVD_NAME }}.avd
            ~/.android/avd/${{ env.AVD_NAME }}.ini
            ~/.android/adbkey
            ~/.android/adbkey.pub
          key: ${{ steps.avd-key.outputs.key }}
      - name: Record AVD setup and restore timing
        working-directory: android
        env:
          CACHE_HIT: ${{ steps.avd-cache.outputs.cache-hit }}
        run: |
          elapsed=$(( $(date +%s) - $(cat "$RUNNER_TEMP/qmix-avd-setup-start") ))
          printf 'cache-hit=%s\nsetup-image-restore-seconds=%s\n' \
            "$CACHE_HIT" "$elapsed" > app/build/reports/qmix-tv-timings.log
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare clean AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        working-directory: android
        run: |
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME" app/build/reports
          if [[ ! -f "$ANDROID_USER_HOME/adbkey" ]]; then
            adb keygen "$ANDROID_USER_HOME/adbkey"
          fi
          chmod 600 "$ANDROID_USER_HOME/adbkey" "$ANDROID_USER_HOME/adbkey.pub"
          export ADB_VENDOR_KEYS="$ANDROID_USER_HOME"
          adb start-server

          prep_start=$(date +%s)
          echo no | avdmanager create avd \
            --force \
            --name "$AVD_NAME" \
            --package "system-images;android-$TV_API_LEVEL;$TV_SYSTEM_IMAGE;$TV_ARCH" \
            --device "$TV_DEVICE_PROFILE" \
            > app/build/reports/qmix-tv-emulator.log 2>&1
          avds=$("$ANDROID_HOME/emulator/emulator" -list-avds)
          printf 'Available AVDs after creation:\n%s\n' "$avds" \
            >> app/build/reports/qmix-tv-emulator.log
          grep -Fxq "$AVD_NAME" <<< "$avds"

          "$ANDROID_HOME/emulator/emulator" -port 5554 -avd "$AVD_NAME" \
            -cores 2 \
            -no-window \
            -gpu swiftshader_indirect \
            -no-snapshot-load \
            -no-snapshot-save \
            -noaudio \
            -no-boot-anim \
            -no-metrics \
            -camera-back none \
            >> app/build/reports/qmix-tv-emulator.log 2>&1 &
          emulator_pid=$!
          cleanup() {
            status=$?
            adb devices -l > app/build/reports/qmix-tv-adb.log 2>&1 || true
            adb -s emulator-5554 shell getprop >> app/build/reports/qmix-tv-adb.log 2>&1 || true
            adb -s emulator-5554 shell service check input >> app/build/reports/qmix-tv-adb.log 2>&1 || true
            adb -s emulator-5554 logcat -d > app/build/reports/qmix-tv-logcat.txt 2>&1 || true
            adb -s emulator-5554 emu kill || true
            wait "$emulator_pid" || true
            return "$status"
          }
          trap cleanup EXIT

          if ! timeout 600 bash -c '
            until [[ "$(adb -s emulator-5554 get-state 2>/dev/null)" == "device" ]] \
              && [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null)" == "1" ]] \
              && adb -s emulator-5554 shell service check input 2>/dev/null | grep -q "found"; do
              sleep 2
            done
          '; then
            ps -p "$emulator_pid" -f || true
            tail -n 200 app/build/reports/qmix-tv-emulator.log || true
            exit 1
          fi
          [[ "$(adb -s emulator-5554 get-state)" == device ]]
          adb -s emulator-5554 shell settings put global window_animation_scale 0.0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0.0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0.0
          adb -s emulator-5554 shell setprop debug.qmix.snapshot_rev "$AVD_PREP_REVISION"
          adb -s emulator-5554 emu avd snapshot save "$AVD_SNAPSHOT_NAME"
          cleanup
          trap - EXIT
          "$ANDROID_HOME/emulator/emulator" -avd "$AVD_NAME" -snapshot-list \
            | grep -Fq "$AVD_SNAPSHOT_NAME"
          printf 'snapshot-prep-seconds=%s\n' "$(( $(date +%s) - prep_start ))" \
            >> app/build/reports/qmix-tv-timings.log
      - name: TV emulator smoke and Android coverage gate
        working-directory: android
        env:
          CACHE_HIT: ${{ steps.avd-cache.outputs.cache-hit }}
        run: |
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          test -f "$ANDROID_USER_HOME/adbkey"
          test -f "$ANDROID_USER_HOME/adbkey.pub"
          chmod 600 "$ANDROID_USER_HOME/adbkey" "$ANDROID_USER_HOME/adbkey.pub"
          export ADB_VENDOR_KEYS="$ANDROID_USER_HOME"
          adb start-server
          mkdir -p app/build/reports
          printf '\n=== coverage boot; cache-hit=%s ===\n' "$CACHE_HIT" \
            >> app/build/reports/qmix-tv-emulator.log
          test -d "$ANDROID_AVD_HOME/$AVD_NAME.avd"
          test -f "$ANDROID_AVD_HOME/$AVD_NAME.ini"
          avds=$("$ANDROID_HOME/emulator/emulator" -list-avds)
          printf 'Available AVDs:\n%s\n' "$avds" >> app/build/reports/qmix-tv-emulator.log
          grep -Fxq "$AVD_NAME" <<< "$avds"
          "$ANDROID_HOME/emulator/emulator" -avd "$AVD_NAME" -snapshot-list \
            | tee -a app/build/reports/qmix-tv-emulator.log \
            | grep -Fq "$AVD_SNAPSHOT_NAME"

          emulator_coverage_start=$(date +%s)
          boot_start=$(date +%s)
          "$ANDROID_HOME/emulator/emulator" -port 5554 -avd "$AVD_NAME" \
            -cores 2 \
            -no-window \
            -gpu swiftshader_indirect \
            -snapshot "$AVD_SNAPSHOT_NAME" \
            -no-snapshot-save \
            -noaudio \
            -no-boot-anim \
            -no-metrics \
            -camera-back none \
            >> app/build/reports/qmix-tv-emulator.log 2>&1 &
          emulator_pid=$!
          cleanup() {
            status=$?
            adb devices -l > app/build/reports/qmix-tv-adb.log 2>&1 || true
            adb -s emulator-5554 shell getprop >> app/build/reports/qmix-tv-adb.log 2>&1 || true
            adb -s emulator-5554 shell service check input >> app/build/reports/qmix-tv-adb.log 2>&1 || true
            adb -s emulator-5554 logcat -d > app/build/reports/qmix-tv-logcat.txt 2>&1 || true
            adb -s emulator-5554 emu kill || true
            wait "$emulator_pid" || true
            return "$status"
          }
          trap cleanup EXIT

          if ! timeout 600 bash -c '
            until [[ "$(adb -s emulator-5554 get-state 2>/dev/null)" == "device" ]] \
              && [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null)" == "1" ]] \
              && adb -s emulator-5554 shell service check input 2>/dev/null | grep -q "found"; do
              sleep 2
            done
          '; then
            ps -p "$emulator_pid" -f || true
            tail -n 200 app/build/reports/qmix-tv-emulator.log || true
            exit 1
          fi
          for _ in 1 2 3; do
            [[ "$(adb -s emulator-5554 get-state)" == device ]]
            sleep 2
          done
          [[ "$(adb -s emulator-5554 shell getprop debug.qmix.snapshot_rev)" == "$AVD_PREP_REVISION" ]]
          printf 'snapshot-boot-seconds=%s\n' "$(( $(date +%s) - boot_start ))" \
            >> app/build/reports/qmix-tv-timings.log
          coverage_start=$(date +%s)
          ./gradlew --no-daemon :app:jacocoDebugCoverageVerification
          printf 'coverage-seconds=%s\nemulator-coverage-seconds=%s\n' \
            "$(( $(date +%s) - coverage_start ))" \
            "$(( $(date +%s) - emulator_coverage_start ))" \
            >> app/build/reports/qmix-tv-timings.log
      - name: Save Android TV AVD snapshot
        if: success() && steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.android/avd/${{ env.AVD_NAME }}.avd
            ~/.android/avd/${{ env.AVD_NAME }}.ini
            ~/.android/adbkey
            ~/.android/adbkey.pub
          key: ${{ steps.avd-key.outputs.key }}
      - name: Collect Android TV diagnostics
        if: always()
        working-directory: android
        run: |
          mkdir -p app/build/reports
          touch \
            app/build/reports/qmix-tv-emulator.log \
            app/build/reports/qmix-tv-adb.log \
            app/build/reports/qmix-tv-logcat.txt \
            app/build/reports/qmix-tv-timings.log
          if command -v adb >/dev/null 2>&1; then
            adb devices -l >> app/build/reports/qmix-tv-adb.log 2>&1 || true
          fi
      - name: Upload instrumentation and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-tv-test-reports
          path: |
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/reports/androidTests/connected/
            android/app/build/reports/jacoco/jacocoDebugReport/
            android/app/build/reports/qmix-tv-emulator.log
            android/app/build/reports/qmix-tv-adb.log
            android/app/build/reports/qmix-tv-logcat.txt
            android/app/build/reports/qmix-tv-timings.log
          if-no-files-found: error

  result:
    if: always()
    needs: [route, android-build, android-tv-instrumentation]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          ROUTE_OUTPUT: ${{ needs.route.outputs.android }}
          BUILD_RESULT: ${{ needs.android-build.result }}
          INSTRUMENTATION_RESULT: ${{ needs.android-tv-instrumentation.result }}
        run: |
          [[ "$ROUTE_RESULT" == success ]]
          if [[ "$ROUTE_OUTPUT" == true ]]; then
            expected=success
          elif [[ "$ROUTE_OUTPUT" == false ]]; then
            expected=skipped
          else
            exit 1
          fi
          for result in "$BUILD_RESULT" "$INSTRUMENTATION_RESULT"; do
            [[ "$result" == "$expected" ]] || exit 1
          done
