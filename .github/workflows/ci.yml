name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # PR updates replace stale runs. Main pushes each get a distinct group: even
  # a pending run must survive a third push to write its own history point.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.paths.outputs.ci }}
      android: ${{ steps.paths.outputs.android }}
      erosion: ${{ steps.paths.outputs.erosion }}
      duplication: ${{ steps.paths.outputs.duplication }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        name: Route changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Every main push records both reports, including documentation-only pushes.
          FORCE_EROSION: ${{ github.event_name == 'push' }}
          FORCE_DUPLICATION: ${{ github.event_name == 'push' }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            printf 'ci=true\nandroid=true\nlive=true\nerosion=true\nduplication=true\n' >> "$GITHUB_OUTPUT"
          elif git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"; then
            python3 .github/scripts/workflow_paths.py \
              < "$RUNNER_TEMP/changed-paths" >> "$GITHUB_OUTPUT"
          else
            printf 'ci=true\nandroid=true\nlive=true\nerosion=true\nduplication=true\n' >> "$GITHUB_OUTPUT"
          fi

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify Compose project contract
        run: |
          set -o pipefail
          eval "$(go run ./internal/buildinfo/cmd/version -format=env)"
          export VERSION COMMIT DIRTY ANDROID_VERSION_CODE
          QMIX_LOG_GID=$(python3 scripts/prepare_compose_logs.py)
          export QMIX_LOG_GID
          docker compose config --format json | jq -e '.name == "agent-apps"'
      - name: Install hash-pinned erosion test dependencies
        run: |
          python -m venv "$RUNNER_TEMP/erosion-policy-venv"
          "$RUNNER_TEMP/erosion-policy-venv/bin/python" -m pip install \
            --require-hashes --no-deps -r .github/requirements-lizard.txt
          echo "$RUNNER_TEMP/erosion-policy-venv/bin" >> "$GITHUB_PATH"
      - name: Repository policy and routing tests
        run: make test-workflow-routing test-public-readiness test-sbom test-release-payload test-release-pipeline test-actionlint test-cyrillic check-cyrillic

  ci:
    needs: route
    if: needs.route.outputs.ci == 'true'
    runs-on: ubuntu-latest
    env:
      QMIX_REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
      - name: Lint (gofmt + vet)
        run: |
          test -z "$(gofmt -l .)" || { echo "not gofmt-ed:"; gofmt -l .; exit 1; }
          go vet ./...
      - name: Build
        run: make build
      - name: Generate and validate Go release SBOM
        run: make sbom-go
      # gotestsum wraps go test to also emit a JUnit report for the "Tests"
      # check (qmix#47); the go test flags themselves are unchanged.
      - name: Test
        run: |
          go run gotest.tools/gotestsum@v1.13.0 --junitfile unit.xml -- -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Test summary
        if: always()
        run: |
          [ -f unit.xml ] || exit 0
          python3 .github/scripts/test_summary.py unit.xml "### Tests: ci" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report-unit
          path: unit.xml
          if-no-files-found: error
      - name: Coverage gate (>=95%)
        run: |
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 95.0) { print "FAIL: coverage " t "% < 95%"; exit 1 } }'

  # Mandatory integration level (qmix#17): core scenarios (healthz, room
  # lifecycle, SSE, mock resolver, streaming via a fake yt-dlp + local mock
  # upstream, TTL) over HTTP on a real socket with the full App handler.
  # No network or secrets are required, so this job must stay green.
  integration-mandatory:
    needs: route
    if: needs.route.outputs.ci == 'true'
    runs-on: ubuntu-latest
    env:
      QMIX_REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
      - name: Verify Node.js is available
        run: node --version
      # Args mirror `make test-integration`; gotestsum adds the JUnit report
      # for the "Tests" check (qmix#47).
      - name: Integration tests (mandatory)
        run: |
          go run gotest.tools/gotestsum@v1.13.0 --junitfile integration.xml -- -race -tags=integration -run 'Integration' ./internal/server/...
      - name: Test summary
        if: always()
        run: |
          [ -f integration.xml ] || exit 0
          python3 .github/scripts/test_summary.py integration.xml "### Tests: integration-mandatory" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report-integration-mandatory
          path: integration.xml
          if-no-files-found: error

  # Informational only: the score never fails this job. A lizard failure or
  # Kotlin parse/coverage failure fails loudly instead.
  erosion:
    needs: route
    if: needs.route.outputs.erosion == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install hash-pinned lizard, tree-sitter and declared dependencies
        run: |
          python -m venv "$RUNNER_TEMP/erosion-venv"
          "$RUNNER_TEMP/erosion-venv/bin/python" -m pip install \
            --require-hashes --no-deps -r .github/requirements-lizard.txt
      - name: Test erosion metrics, Kotlin counter and benchmark conversion
        run: |
          "$RUNNER_TEMP/erosion-venv/bin/python" .github/scripts/erosion_test.py -v
          "$RUNNER_TEMP/erosion-venv/bin/python" .github/scripts/kotlin_complexity_test.py -v
          "$RUNNER_TEMP/erosion-venv/bin/python" .github/scripts/benchmark_metrics_test.py -v
      - name: Analyze production source
        run: |
          mkdir -p "$RUNNER_TEMP/erosion"
          "$RUNNER_TEMP/erosion-venv/bin/python" .github/scripts/erosion.py \
            --lizard "$RUNNER_TEMP/erosion-venv/bin/lizard" \
            --output "$RUNNER_TEMP/erosion/report.json" \
            --summary "$RUNNER_TEMP/erosion/report.md"
          cat "$RUNNER_TEMP/erosion/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload erosion report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: code-erosion
          path: ${{ runner.temp }}/erosion/
          if-no-files-found: error

  # qmix#199: compare the PR head against its base without running base code.
  complexity-gate:
    name: complexity-gate
    needs: route
    if: github.event_name == 'pull_request' && needs.route.outputs.erosion == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install hash-pinned lizard, tree-sitter and declared dependencies
        run: |
          python -m venv "$RUNNER_TEMP/complexity-venv"
          "$RUNNER_TEMP/complexity-venv/bin/python" -m pip install \
            --require-hashes --no-deps -r .github/requirements-lizard.txt
          echo "$RUNNER_TEMP/complexity-venv/bin" >> "$GITHUB_PATH"
      - name: Test complexity gate
        run: python3 .github/scripts/complexity_gate_test.py -v
      - name: Prepare pull-request base snapshot
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
      - name: Compare base and head complexity
        id: gate
        run: |
          mkdir -p "$RUNNER_TEMP/complexity-gate"
          python3 .github/scripts/complexity_gate.py \
            --base "$RUNNER_TEMP/base" --head . \
            --json "$RUNNER_TEMP/complexity-gate/report.json" \
            --markdown "$RUNNER_TEMP/complexity-gate/report.md"
      - name: Complexity gate summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/complexity-gate/report.md" ]]; then
            cat "$RUNNER_TEMP/complexity-gate/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### Complexity gate\n\nAnalysis did not produce a report; inspect the failed step.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload complexity gate report
        if: always() && steps.gate.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: complexity-gate
          path: ${{ runner.temp }}/complexity-gate/report.json
          if-no-files-found: error

  # Informational only (qmix#200): the score never fails the job; installation
  # and report errors fail closed. Run on routed PRs and every main push for #201.
  # The binary lives in this job's temp directory.
  duplication:
    needs: route
    if: needs.route.outputs.duplication == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-verified jscpd v5.3.2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jscpd"
          curl --fail --location --retry 3 \
            https://github.com/kucherenko/jscpd/releases/download/v5.3.2/jscpd-linux-x64-gnu.tar.gz \
            --output "$RUNNER_TEMP/jscpd/jscpd-linux-x64-gnu.tar.gz"
          cd "$RUNNER_TEMP/jscpd"
          printf '%s  %s\n' \
            '97259f222ea7f6d51a0f2faa98ed5889430233e0fb8d2c129f23d84aff4b93b2' 'jscpd-linux-x64-gnu.tar.gz' | sha256sum -c -
          tar -xzf jscpd-linux-x64-gnu.tar.gz
          test -x ./jscpd
          ./jscpd --version
      - name: Test duplication report normalization
        run: python3 .github/scripts/jscpd_report_test.py -v
      - name: Analyze production duplication
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/duplication/raw"
          python3 .github/scripts/jscpd_report.py sources . > "$RUNNER_TEMP/duplication/sources"
          mapfile -d '' -t sources < "$RUNNER_TEMP/duplication/sources"
          (( ${#sources[@]} > 0 ))
          "$RUNNER_TEMP/jscpd/jscpd" --config .jscpd.json --absolute \
            --reporters json --threshold 100 --fail-on-empty \
            --output "$RUNNER_TEMP/duplication/raw" \
            "${sources[@]}"
          python3 .github/scripts/jscpd_report.py report \
            "$RUNNER_TEMP/duplication/raw/jscpd-report.json" \
            "$RUNNER_TEMP/duplication/report.json" \
            "$RUNNER_TEMP/duplication/report.md"
          cat "$RUNNER_TEMP/duplication/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload duplication report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: code-duplication
          path: |
            ${{ runner.temp }}/duplication/report.json
            ${{ runner.temp }}/duplication/report.md
          if-no-files-found: error

  # qmix#202: gate jscpd's new clones relative to the PR base, not overall %.
  clone-gate:
    name: clone-gate
    needs: route
    if: github.event_name == 'pull_request' && needs.route.outputs.duplication == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified jscpd v5.3.2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jscpd"
          curl --fail --location --retry 3 \
            https://github.com/kucherenko/jscpd/releases/download/v5.3.2/jscpd-linux-x64-gnu.tar.gz \
            --output "$RUNNER_TEMP/jscpd/jscpd-linux-x64-gnu.tar.gz"
          cd "$RUNNER_TEMP/jscpd"
          printf '%s  %s\n' \
            '97259f222ea7f6d51a0f2faa98ed5889430233e0fb8d2c129f23d84aff4b93b2' 'jscpd-linux-x64-gnu.tar.gz' | sha256sum -c -
          tar -xzf jscpd-linux-x64-gnu.tar.gz
          test -x ./jscpd
          ./jscpd --version
      - name: Test clone gate
        run: python3 .github/scripts/clone_gate_test.py -v
      - name: Scan head against the pull-request base
        id: scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clone-gate"
          python3 .github/scripts/jscpd_report.py sources . > "$RUNNER_TEMP/clone-gate/sources"
          mapfile -d '' -t sources < "$RUNNER_TEMP/clone-gate/sources"
          (( ${#sources[@]} > 0 ))
          set +e
          "$RUNNER_TEMP/jscpd/jscpd" --config .jscpd.json --absolute \
            --reporters json --threshold 100 --fail-on-empty \
            --baseline-from-ref "$BASE_SHA" --fail-on-new-clones \
            --output "$RUNNER_TEMP/clone-gate" "${sources[@]}"
          status=$?
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/clone-gate/scan-status"
          exit "$status"
      - name: Render clone gate report
        id: gate
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/clone-gate"
          python3 .github/scripts/clone_gate.py \
            --report "$RUNNER_TEMP/clone-gate/jscpd-report.json" --repo . \
            --scan-status "$RUNNER_TEMP/clone-gate/scan-status" \
            --json "$RUNNER_TEMP/clone-gate/report.json" \
            --markdown "$RUNNER_TEMP/clone-gate/report.md"
      - name: Clone gate summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/clone-gate/report.md" ]]; then
            cat "$RUNNER_TEMP/clone-gate/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### Clone gate\n\nAnalysis did not produce a report; inspect the failed step.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload clone gate report
        if: always() && steps.gate.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clone-gate
          path: ${{ runner.temp }}/clone-gate/report.json
          if-no-files-found: error

  # Privileged publisher consumes artifacts only, never checks out PR code.
  publish-erosion:
    needs: [route, erosion, duplication]
    if: ${{ always() && (needs.erosion.result == 'success' || needs.duplication.result == 'success') && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download erosion report
        if: needs.erosion.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: code-erosion
          path: erosion
      - name: Download duplication report
        if: needs.duplication.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: code-duplication
          path: duplication
      - name: Create or update one pull-request comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EROSION_READY: ${{ needs.erosion.result == 'success' }}
          DUPLICATION_READY: ${{ needs.duplication.result == 'success' }}
        run: |
          set -euo pipefail
          report=$(mktemp "$RUNNER_TEMP/qmix-comment.XXXXXX")
          existing=$(mktemp "$RUNNER_TEMP/qmix-existing.XXXXXX")
          trap 'rm -f "$report" "$existing"' EXIT
          if [[ "$EROSION_READY" == true ]]; then
            test -s erosion/report.json
            test -s erosion/report.md
          fi
          if [[ "$DUPLICATION_READY" == true ]]; then
            test -s duplication/report.json
            test -s duplication/report.md
          fi
          [[ "$EROSION_READY" == true || "$DUPLICATION_READY" == true ]]
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- qmix-lizard-erosion -->") or contains("<!-- qmix-jscpd-duplication -->"))) | .id')
          if [[ -n "$comment_id" ]]; then
            comment_id=${comment_id%%$'\n'*}
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" > "$existing"
          else
            printf '{"body":""}\n' > "$existing"
          fi
          # The publisher has no checkout: keep PR-controlled source out of its
          # write-token process. This Python function is exercised by routing tests.
          python3 - "$report" "$existing" <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys
          MARKERS = ("<!-- qmix-lizard-erosion -->", "<!-- qmix-jscpd-duplication -->")
          def sections(body):
              matches = list(re.finditer(r"(?m)^<!-- qmix-(?:lizard-erosion|jscpd-duplication) -->$", body))
              if body and (not matches or body[:matches[0].start()].strip()):
                  raise ValueError("existing comment has no recognized first section")
              result = {}
              for index, match in enumerate(matches):
                  marker = match.group()
                  if marker in result:
                      raise ValueError("duplicate report section")
                  end = matches[index + 1].start() if index + 1 < len(matches) else len(body)
                  section = body[match.start():end].rstrip("\n")
                  if section != marker:
                      result[marker] = section
              return result
          previous = json.loads(pathlib.Path(sys.argv[2]).read_text())["body"]
          if not isinstance(previous, str):
              raise ValueError("invalid existing comment")
          merged = sections(previous)
          for ready, path, marker in (
              ("EROSION_READY", "erosion/report.md", MARKERS[0]),
              ("DUPLICATION_READY", "duplication/report.md", MARKERS[1]),
          ):
              if os.environ[ready] == "true":
                  text = pathlib.Path(path).read_text()
                  if not text.startswith(marker + "\n") or set(sections(text)) != {marker}:
                      raise ValueError("invalid report section")
                  merged[marker] = text.rstrip("\n")
          pathlib.Path(sys.argv[1]).write_text("\n\n".join(merged[marker] for marker in MARKERS if marker in merged) + "\n")
          PY
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -f body="$(< "$report")" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$(< "$report")" > /dev/null
          fi

  # History writes are trusted main pushes only; PR source has no write token.
  # Publish both series in one serialized job and retain the erosion check name.
  erosion-history:
    needs: [erosion, duplication]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.erosion.result == 'success' || needs.duplication.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: erosion-history-main
      # Retain every pending push, rather than replacing the older pending job.
      # GitHub caps this queue at 100; above that limit, manual recovery is needed.
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download erosion report
        if: needs.erosion.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: code-erosion
          path: ${{ runner.temp }}/erosion
      - name: Convert erosion report to benchmark metrics
        if: needs.erosion.result == 'success'
        run: |
          python3 .github/scripts/benchmark_metrics.py \
            --input "$RUNNER_TEMP/erosion/report.json" \
            --output "$RUNNER_TEMP/erosion/benchmark.json"
      - name: Publish erosion history and alert
        if: needs.erosion.result == 'success'
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Code erosion
          tool: customSmallerIsBetter
          output-file-path: ${{ runner.temp }}/erosion/benchmark.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ github.token }}
          auto-push: true
          alert-threshold: "110%"
          comment-on-alert: true
          fail-on-alert: false
      - name: Download duplication report
        if: needs.duplication.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: code-duplication
          path: ${{ runner.temp }}/duplication
      - name: Convert duplication report to benchmark metrics
        if: needs.duplication.result == 'success'
        run: |
          python3 .github/scripts/benchmark_metrics.py --kind duplication \
            --input "$RUNNER_TEMP/duplication/report.json" \
            --output "$RUNNER_TEMP/duplication/benchmark.json"
      - name: Publish duplication history and alert
        if: needs.duplication.result == 'success'
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Code duplication
          tool: customSmallerIsBetter
          output-file-path: ${{ runner.temp }}/duplication/benchmark.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ github.token }}
          auto-push: true
          alert-threshold: "110%"
          comment-on-alert: true
          fail-on-alert: false

  # GitHub Actions Pages deployment is required because GITHUB_TOKEN branch
  # writes do not trigger branch-based Pages builds. Read is explicit: a job-level
  # permissions map does not inherit workflow-level contents: read.
  erosion-pages:
    needs: erosion-history
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.erosion-history.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: erosion-pages
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          persist-credentials: false
      - name: Bypass Jekyll in the uploaded snapshot
        run: touch .nojekyll
      - name: Upload chart snapshot
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .
          include-hidden-files: true
      - name: Deploy chart
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  # Test reports are published from artifacts so this privileged job never
  # checks out or executes pull-request-controlled repository code.
  publish-test-reports:
    needs: [route, ci, integration-mandatory]
    if: ${{ always() && needs.route.outputs.ci == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Download test reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: test-report-*
          path: test-reports
          merge-multiple: true
      - name: Publish unit test report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          check_name: Tests
          report_paths: 'test-reports/unit.xml'
          include_passed: true
          include_skipped: true
          require_tests: true
          fail_on_parse_error: true
      - name: Publish integration test report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          check_name: Tests (integration-mandatory)
          report_paths: 'test-reports/integration.xml'
          include_passed: true
          include_skipped: true
          require_tests: true
          fail_on_parse_error: true


  # Runtime image gate: yt-dlp must be present in the container (the
  # streaming backend needs it) and the server must boot and answer
  # /healthz. Runners cannot reach YouTube, so actual streaming stays
  # gated locally (qmix#16).
  docker:
    needs: route
    if: needs.route.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
      - name: Build image and verify metadata
        run: .github/scripts/test_docker_metadata.sh qmix:ci
      - name: yt-dlp present in image
        run: docker run --rm --entrypoint sh qmix:ci -c 'yt-dlp --version'
      - name: "libcrypto3/libssl3 patched (CVE-2026-14456, qmix#38)"
        run: |
          v=$(docker run --rm --entrypoint sh qmix:ci -c 'apk info libcrypto3 libssl3')
          echo "installed: $v"
          if echo "$v" | grep -q '3\.5\.7-'; then
            echo "FAIL: libcrypto3/libssl3 3.5.7-r0 (CVE-2026-14456) still in image"
            exit 1
          fi
      - name: "Smoke: server boots and /healthz answers"
        run: |
          docker run -d --name qmix-smoke qmix:ci
          ok=""
          for _ in $(seq 1 15); do
            if docker exec qmix-smoke wget -qO- http://127.0.0.1:8080/healthz; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            docker logs qmix-smoke
            docker rm -f qmix-smoke
            exit 1
          fi
          docker rm -f qmix-smoke
      - name: "Smoke: logs reach Docker and survive container recreation"
        shell: bash
        run: |
          set -euo pipefail
          eval "$(go run ./internal/buildinfo/cmd/version -format=env)"
          export VERSION COMMIT DIRTY ANDROID_VERSION_CODE QMIX_IMAGE_TAG=ci QMIX_LOG_LEVEL=debug
          QMIX_LOG_GID=$(python3 scripts/prepare_compose_logs.py)
          export QMIX_LOG_GID
          host_uid=$(id -u)
          trap 'docker compose down --remove-orphans' EXIT

          docker compose up -d --no-build backend
          ready=""
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8180/healthz >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            docker compose logs --no-color backend
            exit 1
          fi
          docker compose logs --no-color --no-log-prefix backend > "$RUNNER_TEMP/qmix-docker.log"
          test -s "$RUNNER_TEMP/qmix-docker.log"
          while IFS= read -r line; do
            jq -e . <<<"$line" >/dev/null
          done < "$RUNNER_TEMP/qmix-docker.log"
          grep -F '"component":"server/http"' "$RUNNER_TEMP/qmix-docker.log" | grep -F '"level":"INFO"' | grep -F '"msg":"server listening"'

          docker compose exec -T backend cat /var/log/qmix/qmix.log > "$RUNNER_TEMP/qmix-file.log"
          while IFS= read -r line; do
            jq -e . <<<"$line" >/dev/null
          done < "$RUNNER_TEMP/qmix-file.log"
          grep -F '"component":"server/http"' "$RUNNER_TEMP/qmix-file.log" | grep -F '"msg":"server listening"'
          log_dir_mode_owner=$(stat -c '%a %u %g' agent-apps-data/qmix/logs)
          log_file_mode_owner=$(stat -c '%a %u %g' agent-apps-data/qmix/logs/qmix.log)
          test "$log_dir_mode_owner" = "770 $host_uid $QMIX_LOG_GID"
          test "$log_file_mode_owner" = "600 10001 10001"
          test "$(docker compose exec -T backend id -u)" = "10001"
          before=$(docker compose exec -T backend grep -cF '"msg":"server listening"' /var/log/qmix/qmix.log)

          docker compose rm -s -f backend
          docker compose up -d --no-build backend
          ready=""
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8180/healthz >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            docker compose logs --no-color backend
            exit 1
          fi
          after=$(docker compose exec -T backend grep -cF '"msg":"server listening"' /var/log/qmix/qmix.log)
          (( after > before ))
      - name: Image size
        run: |
          docker image inspect qmix:ci --format 'image size: {{.Size}} bytes'

  # qmix#322: offline RC/stable fixtures, never a release event or publisher.
  release-payload:
    needs: route
    if: needs.route.outputs.ci == 'true' || needs.route.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['0.1.0-rc.1', '0.1.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install existing pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build complete offline payload from a clean fixture
        env:
          FIXTURE_VERSION: ${{ matrix.version }}
        run: |
          sha=$(git rev-parse --verify --end-of-options 'HEAD^{commit}')
          git clone --no-local --no-tags "$GITHUB_WORKSPACE" "$RUNNER_TEMP/release-source"
          cd "$RUNNER_TEMP/release-source" || exit 1
          git checkout --detach "$sha"
          # Local-only tags in an isolated hosted fixture; never push them.
          git tag "v$FIXTURE_VERSION" "$sha"
          python .github/scripts/release_payload.py build-go --output "$RUNNER_TEMP/go-payload"
          python .github/scripts/generate_sbom.py go \
            --target-inventory "$RUNNER_TEMP/go-payload/go-inventory.json" \
            --output "$RUNNER_TEMP/go.cdx.json"
          (cd android && ./gradlew --no-daemon --dependency-verification=strict :app:assembleRelease)
          apk="$RUNNER_TEMP/release-source/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          python .github/scripts/generate_sbom.py android --apk "$apk" --output "$RUNNER_TEMP/android.cdx.json"
          .github/scripts/validate_sbom_schema.sh "$RUNNER_TEMP/go.cdx.json" "$RUNNER_TEMP/android.cdx.json"
          for destination in offline-payload offline-repeat; do
            python .github/scripts/release_payload.py package \
              --go-inventory "$RUNNER_TEMP/go-payload/go-inventory.json" --apk "$apk" \
              --go-bom "$RUNNER_TEMP/go.cdx.json" --android-bom "$RUNNER_TEMP/android.cdx.json" \
              --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --output "$RUNNER_TEMP/$destination"
          done
          diff -r "$RUNNER_TEMP/offline-payload" "$RUNNER_TEMP/offline-repeat"
          (cd "$RUNNER_TEMP/offline-payload" && sha256sum -c SHA256SUMS)
          test -z "$(git status --porcelain)"
          python3 .github/scripts/release_fixture.py finalize --unsigned "$RUNNER_TEMP/offline-payload" \
            --output "$RUNNER_TEMP/final-payload" --receipt "$RUNNER_TEMP/fixture-receipt.json"
          .github/scripts/validate_sbom_schema.sh "$RUNNER_TEMP/final-payload/"*.cdx.json
      - name: Preserve unpublished payload and source hashes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-payload-${{ matrix.version }}
          path: ${{ runner.temp }}/offline-payload/
          if-no-files-found: error
      - name: Preserve signed-final disposable fixture (no signing material)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-payload-${{ matrix.version }}
          path: ${{ runner.temp }}/final-payload/
          if-no-files-found: error
      - name: Preserve public fixture certificate/hash receipt separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fixture-signing-${{ matrix.version }}
          path: ${{ runner.temp }}/fixture-receipt.json
          if-no-files-found: error

  release-native:
    needs: [route, release-payload]
    if: needs.route.outputs.ci == 'true' || needs.route.outputs.android == 'true'
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        version: ['0.1.0-rc.1', '0.1.0']
        target:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: windows-2025
            os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: final-payload-${{ matrix.version }}
          path: ${{ runner.temp }}/offline-payload/
      - name: Execute the exact distributed native bytes with --version
        env:
          FIXTURE_VERSION: ${{ matrix.version }}
          TARGET_OS: ${{ matrix.target.os }}
          TARGET_ARCH: ${{ matrix.target.arch }}
        run: |
          sha=$(git rev-parse --verify --end-of-options 'HEAD^{commit}')
          git clone --no-local --no-tags "$GITHUB_WORKSPACE" "$RUNNER_TEMP/native-source"
          cd "$RUNNER_TEMP/native-source" || exit 1
          git checkout --detach "$sha"
          git tag "v$FIXTURE_VERSION" "$sha"
          python .github/scripts/release_payload.py verify-native \
            --inventory "$RUNNER_TEMP/offline-payload/qmix-inventory-$FIXTURE_VERSION-any-any.json" \
            --os "$TARGET_OS" --arch "$TARGET_ARCH" --signed-final --receipt "$RUNNER_TEMP/native-receipt.json"
          test -z "$(git status --porcelain)"
      - name: Preserve native execution receipts bound to payload hashes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-native-${{ matrix.version }}-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: ${{ runner.temp }}/native-receipt.json
          if-no-files-found: error

  # qmix#334: SDK-verified downloaded bytes installed on a clean hosted TV.
  release-tv:
    needs: [route, release-payload]
    if: needs.route.outputs.ci == 'true' || needs.route.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['0.1.0-rc.1', '0.1.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install existing pinned TV SDK and enable KVM
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-36;android-tv;x86"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: final-payload-${{ matrix.version }}
          path: ${{ runner.temp }}/final/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fixture-signing-${{ matrix.version }}
          path: ${{ runner.temp }}/signing/
      - name: Verify downloaded final set then clean install and Leanback launch
        env:
          FIXTURE_VERSION: ${{ matrix.version }}
        run: |
          sha=$(git rev-parse --verify --end-of-options 'HEAD^{commit}')
          git clone --no-local --no-tags "$GITHUB_WORKSPACE" "$RUNNER_TEMP/tv-source"
          cd "$RUNNER_TEMP/tv-source" || exit 1
          git checkout --detach "$sha"
          git tag "v$FIXTURE_VERSION" "$sha"
          python3 .github/scripts/release_fixture.py verify --directory "$RUNNER_TEMP/final" --receipt "$RUNNER_TEMP/signing/fixture-receipt.json"
          bash .github/scripts/release_tv_install.sh \
            "$RUNNER_TEMP/final/qmix-android-$FIXTURE_VERSION-android-any.apk" \
            "$RUNNER_TEMP/final/qmix-inventory-$FIXTURE_VERSION-any-any.json" "$RUNNER_TEMP/tv-receipt.json"
      - name: Preserve TV receipts and diagnostics (no signing material)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-tv-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/tv-receipt.json
            ${{ runner.temp }}/release-tv-emulator.log
            ${{ runner.temp }}/installed-package.txt
            ${{ runner.temp }}/leanback-launch.txt
            ${{ runner.temp }}/leanback-activity.txt
          if-no-files-found: error

  release-images:
    needs: route
    if: needs.route.outputs.ci == 'true' || needs.route.outputs.android == 'true'
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['0.1.0-rc.1', '0.1.0']
        target:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build/run actual native fixture image
        env:
          FIXTURE_VERSION: ${{ matrix.version }}
          TARGET_ARCH: ${{ matrix.target.arch }}
        run: |
          sha=$(git rev-parse --verify --end-of-options 'HEAD^{commit}')
          git clone --no-local --no-tags "$GITHUB_WORKSPACE" "$RUNNER_TEMP/image-source"
          cd "$RUNNER_TEMP/image-source" || exit 1
          git checkout --detach "$sha"
          git tag "v$FIXTURE_VERSION" "$sha"
          python3 .github/scripts/release_images.py --arch "$TARGET_ARCH" --output "$RUNNER_TEMP/images"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fixture-image-${{ matrix.version }}-${{ matrix.target.arch }}
          path: ${{ runner.temp }}/images/*.json
          if-no-files-found: error

  release-image-plan:
    needs: [route, release-images]
    if: needs.route.outputs.ci == 'true' || needs.route.outputs.android == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        version: ['0.1.0-rc.1', '0.1.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: fixture-image-${{ matrix.version }}-*
          path: ${{ runner.temp }}/images/
          merge-multiple: true
      - name: Bind both native proofs to an offline config-digest plan
        env:
          FIXTURE_VERSION: ${{ matrix.version }}
        run: |
          sha=$(git rev-parse --verify --end-of-options 'HEAD^{commit}')
          git clone --no-local --no-tags "$GITHUB_WORKSPACE" "$RUNNER_TEMP/plan-source"
          cd "$RUNNER_TEMP/plan-source" || exit 1
          git checkout --detach "$sha"
          git tag "v$FIXTURE_VERSION" "$sha"
          python3 .github/scripts/release_images.py --plan "$RUNNER_TEMP/images" --output "$RUNNER_TEMP/image-plan.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fixture-image-plan-${{ matrix.version }}
          path: ${{ runner.temp }}/image-plan.json
          if-no-files-found: error

  result:
    name: CI result
    if: always()
    needs: [route, policy, ci, integration-mandatory, publish-test-reports, docker, erosion, duplication, publish-erosion, erosion-history, erosion-pages, release-payload, release-native, release-tv, release-images, release-image-plan]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          ROUTE_OUTPUT: ${{ needs.route.outputs.ci }}
          EROSION_OUTPUT: ${{ needs.route.outputs.erosion }}
          EROSION_RESULT: ${{ needs.erosion.result }}
          DUPLICATION_OUTPUT: ${{ needs.route.outputs.duplication }}
          DUPLICATION_RESULT: ${{ needs.duplication.result }}
          EROSION_REPORT_RESULT: ${{ needs.publish-erosion.result }}
          HISTORY_RESULT: ${{ needs.erosion-history.result }}
          PAGES_RESULT: ${{ needs.erosion-pages.result }}
          RELEASE_OUTPUT: ${{ needs.route.outputs.ci == 'true' || needs.route.outputs.android == 'true' }}
          PAYLOAD_RESULT: ${{ needs.release-payload.result }}
          NATIVE_RESULT: ${{ needs.release-native.result }}
          TV_RESULT: ${{ needs.release-tv.result }}
          IMAGES_RESULT: ${{ needs.release-images.result }}
          IMAGE_PLAN_RESULT: ${{ needs.release-image-plan.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          CI_RESULT: ${{ needs.ci.result }}
          INTEGRATION_RESULT: ${{ needs.integration-mandatory.result }}
          REPORT_RESULT: ${{ needs.publish-test-reports.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          [[ "$ROUTE_RESULT" == success && "$POLICY_RESULT" == success ]]
          if [[ "$RELEASE_OUTPUT" == true ]]; then
            [[ "$PAYLOAD_RESULT" == success && "$NATIVE_RESULT" == success && "$TV_RESULT" == success && "$IMAGES_RESULT" == success && "$IMAGE_PLAN_RESULT" == success ]]
          elif [[ "$RELEASE_OUTPUT" == false ]]; then
            [[ "$PAYLOAD_RESULT" == skipped && "$NATIVE_RESULT" == skipped && "$TV_RESULT" == skipped && "$IMAGES_RESULT" == skipped && "$IMAGE_PLAN_RESULT" == skipped ]]
          else
            exit 1
          fi
          if [[ "$ROUTE_OUTPUT" == true ]]; then
            expected=success
          elif [[ "$ROUTE_OUTPUT" == false ]]; then
            expected=skipped
          else
            exit 1
          fi
          for result in "$CI_RESULT" "$INTEGRATION_RESULT" "$DOCKER_RESULT"; do
            [[ "$result" == "$expected" ]] || exit 1
          done
          if [[ "$ROUTE_OUTPUT" == true && ("$EVENT_NAME" != pull_request || ("$HEAD_REPOSITORY" == "$REPOSITORY" && "$ACTOR" != 'dependabot[bot]')) ]]; then
            [[ "$REPORT_RESULT" == success ]]
          else
            [[ "$REPORT_RESULT" == skipped ]]
          fi
          if [[ "$EROSION_OUTPUT" == true ]]; then
            [[ "$EROSION_RESULT" == success ]]
          elif [[ "$EROSION_OUTPUT" == false ]]; then
            [[ "$EROSION_RESULT" == skipped ]]
          else
            exit 1
          fi
          if [[ "$DUPLICATION_OUTPUT" == true ]]; then
            [[ "$DUPLICATION_RESULT" == success ]]
          elif [[ "$DUPLICATION_OUTPUT" == false ]]; then
            [[ "$DUPLICATION_RESULT" == skipped ]]
          else
            exit 1
          fi
          if [[ "$EVENT_NAME" == pull_request && "$HEAD_REPOSITORY" == "$REPOSITORY" && "$ACTOR" != 'dependabot[bot]' && "$PR_AUTHOR" != 'dependabot[bot]' && ("$EROSION_RESULT" == success || "$DUPLICATION_RESULT" == success) ]]; then
            [[ "$EROSION_REPORT_RESULT" == success ]]
          else
            [[ "$EROSION_REPORT_RESULT" == skipped ]]
          fi
          # Publisher failures stay red on their own jobs, without making the
          # stable required check a merge gate. Skipped is valid only when the
          # upstream condition cannot run; cancellation loses a point and fails.
          if [[ "$EVENT_NAME" == push && ("$EROSION_RESULT" == success || "$DUPLICATION_RESULT" == success) ]]; then
            [[ "$HISTORY_RESULT" == success || "$HISTORY_RESULT" == failure ]]
          else
            [[ "$HISTORY_RESULT" == skipped ]]
          fi
          if [[ "$EVENT_NAME" == push && "$HISTORY_RESULT" == success ]]; then
            [[ "$PAGES_RESULT" == success || "$PAGES_RESULT" == failure ]]
          else
            [[ "$PAGES_RESULT" == skipped ]]
          fi
