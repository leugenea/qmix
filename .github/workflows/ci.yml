name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Lint (gofmt + vet)
        run: |
          test -z "$(gofmt -l .)" || { echo "not gofmt-ed:"; gofmt -l .; exit 1; }
          go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Coverage gate (>=95%)
        run: |
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 95.0) { print "FAIL: coverage " t "% < 95%"; exit 1 } }'

  # Mandatory integration level (qmix#17): core scenarios (healthz, room
  # lifecycle, SSE, mock resolver, streaming via a fake yt-dlp + local mock
  # upstream, TTL) over HTTP on a real socket with the full App handler.
  # No network or secrets are required, so this job must stay green.
  integration-mandatory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Integration tests (mandatory)
        run: make test-integration

  # Integration tests with real service credentials. The job always runs; the
  # gated tests skip themselves when the secrets are absent, so this job is
  # green even without them. continue-on-error keeps flaky external APIs from
  # blocking the main CI. (The yt-dlp live stream test is gated locally via
  # QMIX_STREAM_LIVE and skips here since runners can't reach YouTube.)
  integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Integration tests (gated by secrets)
        env:
          QMIX_VK_TOKEN: ${{ secrets.QMIX_VK_TOKEN }}
          QMIX_YM_TOKEN: ${{ secrets.QMIX_YM_TOKEN }}
          QMIX_SPOTIFY_CLIENT_ID: ${{ secrets.QMIX_SPOTIFY_CLIENT_ID }}
          QMIX_SPOTIFY_CLIENT_SECRET: ${{ secrets.QMIX_SPOTIFY_CLIENT_SECRET }}
        run: go test -race -run 'Live|Integration' ./...

  # Runtime image gate: yt-dlp must be present in the container (the
  # streaming backend needs it) and the server must boot and answer
  # /healthz. Runners cannot reach YouTube, so actual streaming stays
  # gated locally (qmix#16).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t qmix:ci .
      - name: yt-dlp present in image
        run: docker run --rm --entrypoint sh qmix:ci -c 'yt-dlp --version'
      - name: "Smoke: server boots and /healthz answers"
        run: |
          docker run -d --name qmix-smoke qmix:ci
          ok=""
          for i in $(seq 1 15); do
            if docker exec qmix-smoke wget -qO- http://127.0.0.1:8080/healthz; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            docker logs qmix-smoke
            docker rm -f qmix-smoke
            exit 1
          fi
          docker rm -f qmix-smoke
      - name: Image size
        run: |
          docker image inspect qmix:ci --format 'image size: {{.Size}} bytes'
