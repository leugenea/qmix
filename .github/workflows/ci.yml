name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # PR updates replace stale runs. Main pushes each get a distinct group: even
  # a pending run must survive a third push to write its own history point.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.paths.outputs.ci }}
      erosion: ${{ steps.paths.outputs.erosion }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        name: Route changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Every main push records a point, including documentation-only pushes.
          FORCE_EROSION: ${{ github.event_name == 'push' }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            printf 'ci=true\nandroid=true\nlive=true\nerosion=true\n' >> "$GITHUB_OUTPUT"
          elif git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"; then
            python3 .github/scripts/workflow_paths.py \
              < "$RUNNER_TEMP/changed-paths" >> "$GITHUB_OUTPUT"
          else
            printf 'ci=true\nandroid=true\nlive=true\nerosion=true\n' >> "$GITHUB_OUTPUT"
          fi

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify Compose project contract
        run: |
          set -o pipefail
          eval "$(go run ./internal/buildinfo/cmd/version -format=env)"
          export VERSION COMMIT DIRTY ANDROID_VERSION_CODE
          QMIX_LOG_GID=$(python3 scripts/prepare_compose_logs.py)
          export QMIX_LOG_GID
          docker compose config --format json | jq -e '.name == "agent-apps"'
      - name: Install hash-pinned erosion test dependencies
        run: |
          python -m venv "$RUNNER_TEMP/erosion-policy-venv"
          "$RUNNER_TEMP/erosion-policy-venv/bin/python" -m pip install \
            --require-hashes --no-deps -r .github/requirements-lizard.txt
          echo "$RUNNER_TEMP/erosion-policy-venv/bin" >> "$GITHUB_PATH"
      - name: Repository policy and routing tests
        run: make test-workflow-routing test-public-readiness test-sbom test-actionlint test-cyrillic check-cyrillic

  ci:
    needs: route
    if: needs.route.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
      - name: Lint (gofmt + vet)
        run: |
          test -z "$(gofmt -l .)" || { echo "not gofmt-ed:"; gofmt -l .; exit 1; }
          go vet ./...
      - name: Build
        run: make build
      - name: Generate and validate Go release SBOM
        run: make sbom-go
      # gotestsum wraps go test to also emit a JUnit report for the "Tests"
      # check (qmix#47); the go test flags themselves are unchanged.
      - name: Test
        run: |
          go run gotest.tools/gotestsum@v1.13.0 --junitfile unit.xml -- -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Test summary
        if: always()
        run: |
          [ -f unit.xml ] || exit 0
          python3 .github/scripts/test_summary.py unit.xml "### Tests: ci" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report-unit
          path: unit.xml
          if-no-files-found: error
      - name: Coverage gate (>=95%)
        run: |
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 95.0) { print "FAIL: coverage " t "% < 95%"; exit 1 } }'

  # Mandatory integration level (qmix#17): core scenarios (healthz, room
  # lifecycle, SSE, mock resolver, streaming via a fake yt-dlp + local mock
  # upstream, TTL) over HTTP on a real socket with the full App handler.
  # No network or secrets are required, so this job must stay green.
  integration-mandatory:
    needs: route
    if: needs.route.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
      # Args mirror `make test-integration`; gotestsum adds the JUnit report
      # for the "Tests" check (qmix#47).
      - name: Integration tests (mandatory)
        run: |
          go run gotest.tools/gotestsum@v1.13.0 --junitfile integration.xml -- -race -tags=integration -run 'Integration' ./internal/server/...
      - name: Test summary
        if: always()
        run: |
          [ -f integration.xml ] || exit 0
          python3 .github/scripts/test_summary.py integration.xml "### Tests: integration-mandatory" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report-integration-mandatory
          path: integration.xml
          if-no-files-found: error

  # Informational only: the score never fails this job. A lizard failure or
  # Kotlin parse/coverage failure fails loudly instead.
  erosion:
    needs: route
    if: needs.route.outputs.erosion == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install hash-pinned lizard, tree-sitter and declared dependencies
        run: |
          python -m venv "$RUNNER_TEMP/erosion-venv"
          "$RUNNER_TEMP/erosion-venv/bin/python" -m pip install \
            --require-hashes --no-deps -r .github/requirements-lizard.txt
      - name: Test erosion metrics, Kotlin counter and benchmark conversion
        run: |
          "$RUNNER_TEMP/erosion-venv/bin/python" .github/scripts/erosion_test.py -v
          "$RUNNER_TEMP/erosion-venv/bin/python" .github/scripts/kotlin_complexity_test.py -v
          "$RUNNER_TEMP/erosion-venv/bin/python" .github/scripts/benchmark_metrics_test.py -v
      - name: Analyze production source
        run: |
          mkdir -p "$RUNNER_TEMP/erosion"
          "$RUNNER_TEMP/erosion-venv/bin/python" .github/scripts/erosion.py \
            --lizard "$RUNNER_TEMP/erosion-venv/bin/lizard" \
            --output "$RUNNER_TEMP/erosion/report.json" \
            --summary "$RUNNER_TEMP/erosion/report.md"
          cat "$RUNNER_TEMP/erosion/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload erosion report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: code-erosion
          path: ${{ runner.temp }}/erosion/
          if-no-files-found: error

  # Privileged publisher consumes only the artifact, never checks out PR code.
  publish-erosion:
    needs: [route, erosion]
    if: ${{ always() && needs.route.outputs.erosion == 'true' && needs.erosion.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download erosion report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: code-erosion
          path: erosion
      - name: Create or update one pull-request comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -s erosion/report.json
          test -s erosion/report.md
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- qmix-lizard-erosion -->"))) | .id')
          if [[ -n "$comment_id" ]]; then
            comment_id=${comment_id%%$'\n'*}
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -f body="$(< erosion/report.md)" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$(< erosion/report.md)" > /dev/null
          fi

  # History writes are trusted main pushes only; PR source has no write token.
  erosion-history:
    needs: erosion
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.erosion.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: erosion-history-main
      # Retain every pending push, rather than replacing the older pending job.
      # GitHub caps this queue at 100; above that limit, manual recovery is needed.
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download erosion report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: code-erosion
          path: ${{ runner.temp }}/erosion
      - name: Convert report to named benchmark metrics
        run: |
          python3 .github/scripts/benchmark_metrics.py \
            --input "$RUNNER_TEMP/erosion/report.json" \
            --output "$RUNNER_TEMP/erosion/benchmark.json"
      - name: Publish history and alert on regression
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Code erosion
          tool: customSmallerIsBetter
          output-file-path: ${{ runner.temp }}/erosion/benchmark.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ github.token }}
          auto-push: true
          alert-threshold: "110%"
          comment-on-alert: true
          fail-on-alert: false

  # GitHub Actions Pages deployment is required because GITHUB_TOKEN branch
  # writes do not trigger branch-based Pages builds. Read is explicit: a job-level
  # permissions map does not inherit workflow-level contents: read.
  erosion-pages:
    needs: erosion-history
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.erosion-history.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: erosion-pages
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          persist-credentials: false
      - name: Bypass Jekyll in the uploaded snapshot
        run: touch .nojekyll
      - name: Upload chart snapshot
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
          include-hidden-files: true
      - name: Deploy chart
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Test reports are published from artifacts so this privileged job never
  # checks out or executes pull-request-controlled repository code.
  publish-test-reports:
    needs: [route, ci, integration-mandatory]
    if: ${{ always() && needs.route.outputs.ci == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Download test reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: test-report-*
          path: test-reports
          merge-multiple: true
      - name: Publish unit test report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          check_name: Tests
          report_paths: 'test-reports/unit.xml'
          include_passed: true
          include_skipped: true
          require_tests: true
          fail_on_parse_error: true
      - name: Publish integration test report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          check_name: Tests (integration-mandatory)
          report_paths: 'test-reports/integration.xml'
          include_passed: true
          include_skipped: true
          require_tests: true
          fail_on_parse_error: true


  # Runtime image gate: yt-dlp must be present in the container (the
  # streaming backend needs it) and the server must boot and answer
  # /healthz. Runners cannot reach YouTube, so actual streaming stays
  # gated locally (qmix#16).
  docker:
    needs: route
    if: needs.route.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
      - name: Build image and verify metadata
        run: .github/scripts/test_docker_metadata.sh qmix:ci
      - name: yt-dlp present in image
        run: docker run --rm --entrypoint sh qmix:ci -c 'yt-dlp --version'
      - name: "libcrypto3/libssl3 patched (CVE-2026-14456, qmix#38)"
        run: |
          v=$(docker run --rm --entrypoint sh qmix:ci -c 'apk info libcrypto3 libssl3')
          echo "installed: $v"
          if echo "$v" | grep -q '3\.5\.7-'; then
            echo "FAIL: libcrypto3/libssl3 3.5.7-r0 (CVE-2026-14456) still in image"
            exit 1
          fi
      - name: "Smoke: server boots and /healthz answers"
        run: |
          docker run -d --name qmix-smoke qmix:ci
          ok=""
          for _ in $(seq 1 15); do
            if docker exec qmix-smoke wget -qO- http://127.0.0.1:8080/healthz; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            docker logs qmix-smoke
            docker rm -f qmix-smoke
            exit 1
          fi
          docker rm -f qmix-smoke
      - name: "Smoke: logs reach Docker and survive container recreation"
        shell: bash
        run: |
          set -euo pipefail
          eval "$(go run ./internal/buildinfo/cmd/version -format=env)"
          export VERSION COMMIT DIRTY ANDROID_VERSION_CODE QMIX_IMAGE_TAG=ci QMIX_LOG_LEVEL=debug
          QMIX_LOG_GID=$(python3 scripts/prepare_compose_logs.py)
          export QMIX_LOG_GID
          host_uid=$(id -u)
          trap 'docker compose down --remove-orphans' EXIT

          docker compose up -d --no-build backend
          ready=""
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8180/healthz >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            docker compose logs --no-color backend
            exit 1
          fi
          docker compose logs --no-color --no-log-prefix backend > "$RUNNER_TEMP/qmix-docker.log"
          test -s "$RUNNER_TEMP/qmix-docker.log"
          while IFS= read -r line; do
            jq -e . <<<"$line" >/dev/null
          done < "$RUNNER_TEMP/qmix-docker.log"
          grep -F '"component":"server/http"' "$RUNNER_TEMP/qmix-docker.log" | grep -F '"level":"INFO"' | grep -F '"msg":"server listening"'

          docker compose exec -T backend cat /var/log/qmix/qmix.log > "$RUNNER_TEMP/qmix-file.log"
          while IFS= read -r line; do
            jq -e . <<<"$line" >/dev/null
          done < "$RUNNER_TEMP/qmix-file.log"
          grep -F '"component":"server/http"' "$RUNNER_TEMP/qmix-file.log" | grep -F '"msg":"server listening"'
          log_dir_mode_owner=$(stat -c '%a %u %g' agent-apps-data/qmix/logs)
          log_file_mode_owner=$(stat -c '%a %u %g' agent-apps-data/qmix/logs/qmix.log)
          test "$log_dir_mode_owner" = "770 $host_uid $QMIX_LOG_GID"
          test "$log_file_mode_owner" = "600 10001 10001"
          test "$(docker compose exec -T backend id -u)" = "10001"
          before=$(docker compose exec -T backend grep -cF '"msg":"server listening"' /var/log/qmix/qmix.log)

          docker compose rm -s -f backend
          docker compose up -d --no-build backend
          ready=""
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8180/healthz >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            docker compose logs --no-color backend
            exit 1
          fi
          after=$(docker compose exec -T backend grep -cF '"msg":"server listening"' /var/log/qmix/qmix.log)
          (( after > before ))
      - name: Image size
        run: |
          docker image inspect qmix:ci --format 'image size: {{.Size}} bytes'

  result:
    name: CI result
    if: always()
    needs: [route, policy, ci, integration-mandatory, publish-test-reports, docker, erosion, publish-erosion, erosion-history, erosion-pages]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          ROUTE_OUTPUT: ${{ needs.route.outputs.ci }}
          EROSION_OUTPUT: ${{ needs.route.outputs.erosion }}
          EROSION_RESULT: ${{ needs.erosion.result }}
          EROSION_REPORT_RESULT: ${{ needs.publish-erosion.result }}
          HISTORY_RESULT: ${{ needs.erosion-history.result }}
          PAGES_RESULT: ${{ needs.erosion-pages.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          CI_RESULT: ${{ needs.ci.result }}
          INTEGRATION_RESULT: ${{ needs.integration-mandatory.result }}
          REPORT_RESULT: ${{ needs.publish-test-reports.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          [[ "$ROUTE_RESULT" == success && "$POLICY_RESULT" == success ]]
          if [[ "$ROUTE_OUTPUT" == true ]]; then
            expected=success
          elif [[ "$ROUTE_OUTPUT" == false ]]; then
            expected=skipped
          else
            exit 1
          fi
          for result in "$CI_RESULT" "$INTEGRATION_RESULT" "$DOCKER_RESULT"; do
            [[ "$result" == "$expected" ]] || exit 1
          done
          if [[ "$ROUTE_OUTPUT" == true && ("$EVENT_NAME" != pull_request || ("$HEAD_REPOSITORY" == "$REPOSITORY" && "$ACTOR" != 'dependabot[bot]')) ]]; then
            [[ "$REPORT_RESULT" == success ]]
          else
            [[ "$REPORT_RESULT" == skipped ]]
          fi
          if [[ "$EROSION_OUTPUT" == true ]]; then
            [[ "$EROSION_RESULT" == success ]]
          elif [[ "$EROSION_OUTPUT" == false ]]; then
            [[ "$EROSION_RESULT" == skipped ]]
          else
            exit 1
          fi
          if [[ "$EROSION_OUTPUT" == true && "$EVENT_NAME" == pull_request && "$HEAD_REPOSITORY" == "$REPOSITORY" && "$ACTOR" != 'dependabot[bot]' && "$PR_AUTHOR" != 'dependabot[bot]' ]]; then
            [[ "$EROSION_REPORT_RESULT" == success ]]
          else
            [[ "$EROSION_REPORT_RESULT" == skipped ]]
          fi
          # Publisher failures stay red on their own jobs, without making the
          # stable required check a merge gate. Skipped is valid only when the
          # upstream condition cannot run; cancellation loses a point and fails.
          if [[ "$EVENT_NAME" == push && "$EROSION_RESULT" == success ]]; then
            [[ "$HISTORY_RESULT" == success || "$HISTORY_RESULT" == failure ]]
          else
            [[ "$HISTORY_RESULT" == skipped ]]
          fi
          if [[ "$EVENT_NAME" == push && "$HISTORY_RESULT" == success ]]; then
            [[ "$PAGES_RESULT" == success || "$PAGES_RESULT" == failure ]]
          else
            [[ "$PAGES_RESULT" == skipped ]]
          fi
