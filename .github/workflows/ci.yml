name: CI

on:
  push:
    branches: [main]
  pull_request:

# The "Tests*" check runs (qmix#47) are published by dorny/test-reporter,
# which needs the checks API; everything else stays read-only.
permissions:
  contents: read
  checks: write
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository language policy
        run: make test-cyrillic check-cyrillic
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Lint (gofmt + vet)
        run: |
          test -z "$(gofmt -l .)" || { echo "not gofmt-ed:"; gofmt -l .; exit 1; }
          go vet ./...
      - name: Build
        run: go build ./...
      # gotestsum wraps go test to also emit a JUnit report for the "Tests"
      # check (qmix#47); the go test flags themselves are unchanged.
      - name: Test
        run: |
          go run gotest.tools/gotestsum@v1.13.0 --junitfile unit.xml -- -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Test summary
        if: always()
        run: |
          [ -f unit.xml ] || exit 0
          python3 .github/scripts/test_summary.py unit.xml "### Tests: ci" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v6.5.0
        with:
          check_name: Tests
          report_paths: 'unit.xml'
          include_passed: true
          include_skipped: true
      - name: Coverage gate (>=95%)
        run: |
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 95.0) { print "FAIL: coverage " t "% < 95%"; exit 1 } }'

  # Mandatory integration level (qmix#17): core scenarios (healthz, room
  # lifecycle, SSE, mock resolver, streaming via a fake yt-dlp + local mock
  # upstream, TTL) over HTTP on a real socket with the full App handler.
  # No network or secrets are required, so this job must stay green.
  integration-mandatory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # Args mirror `make test-integration`; gotestsum adds the JUnit report
      # for the "Tests" check (qmix#47).
      - name: Integration tests (mandatory)
        run: |
          go run gotest.tools/gotestsum@v1.13.0 --junitfile integration.xml -- -race -tags=integration -run 'Integration' ./internal/server/...
      - name: Test summary
        if: always()
        run: |
          [ -f integration.xml ] || exit 0
          python3 .github/scripts/test_summary.py integration.xml "### Tests: integration-mandatory" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v6.5.0
        with:
          check_name: Tests (integration-mandatory)
          report_paths: 'integration.xml'
          include_passed: true
          include_skipped: true

  # Integration tests with real service credentials. The job always runs; the
  # gated tests skip themselves when the secrets are absent, so this job is
  # green even without them. continue-on-error keeps flaky external APIs from
  # blocking the main CI. (The yt-dlp live stream test is gated locally via
  # QMIX_STREAM_LIVE and skips here since runners can't reach YouTube.)
  integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # gotestsum adds the JUnit report for the "Tests" check (qmix#47); the
      # gated live tests show up as skipped when their secrets are absent.
      - name: Integration tests (gated by secrets)
        env:
          QMIX_VK_TOKEN: ${{ secrets.QMIX_VK_TOKEN }}
          QMIX_YM_TOKEN: ${{ secrets.QMIX_YM_TOKEN }}
          QMIX_SPOTIFY_CLIENT_ID: ${{ secrets.QMIX_SPOTIFY_CLIENT_ID }}
          QMIX_SPOTIFY_CLIENT_SECRET: ${{ secrets.QMIX_SPOTIFY_CLIENT_SECRET }}
        run: |
          go run gotest.tools/gotestsum@v1.13.0 --junitfile integration-gated.xml -- -race -run 'Live|Integration' ./...
      - name: Test summary
        if: always()
        run: |
          [ -f integration-gated.xml ] || exit 0
          python3 .github/scripts/test_summary.py integration-gated.xml "### Tests: integration (gated)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v6.5.0
        with:
          check_name: Tests (integration-gated)
          report_paths: 'integration-gated.xml'
          include_passed: true
          include_skipped: true

  # Runtime image gate: yt-dlp must be present in the container (the
  # streaming backend needs it) and the server must boot and answer
  # /healthz. Runners cannot reach YouTube, so actual streaming stays
  # gated locally (qmix#16).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build image and verify metadata
        run: .github/scripts/test_docker_metadata.sh qmix:ci
      - name: yt-dlp present in image
        run: docker run --rm --entrypoint sh qmix:ci -c 'yt-dlp --version'
      - name: "libcrypto3/libssl3 patched (CVE-2026-14456, qmix#38)"
        run: |
          v=$(docker run --rm --entrypoint sh qmix:ci -c 'apk info libcrypto3 libssl3')
          echo "installed: $v"
          if echo "$v" | grep -q '3\.5\.7-'; then
            echo "FAIL: libcrypto3/libssl3 3.5.7-r0 (CVE-2026-14456) still in image"
            exit 1
          fi
      - name: "Smoke: server boots and /healthz answers"
        run: |
          docker run -d --name qmix-smoke qmix:ci
          ok=""
          for i in $(seq 1 15); do
            if docker exec qmix-smoke wget -qO- http://127.0.0.1:8080/healthz; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            docker logs qmix-smoke
            docker rm -f qmix-smoke
            exit 1
          fi
          docker rm -f qmix-smoke
      - name: Image size
        run: |
          docker image inspect qmix:ci --format 'image size: {{.Size}} bytes'
