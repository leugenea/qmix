# Live YouTube smoke from the trusted deploy environment (qmix#18).
# Pull-request code never enters this workflow or the persistent NAS runner.
name: live

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      live: ${{ steps.paths.outputs.live }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: paths
        name: Route changed paths
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == workflow_dispatch || "${{ github.event_name }}" == schedule ]]; then
            printf 'live=true\n' >> "$GITHUB_OUTPUT"
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            printf 'ci=true\nandroid=true\nlive=true\n' >> "$GITHUB_OUTPUT"
          elif git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"; then
            python3 .github/scripts/workflow_paths.py \
              < "$RUNNER_TEMP/changed-paths" >> "$GITHUB_OUTPUT"
          else
            printf 'ci=true\nandroid=true\nlive=true\n' >> "$GITHUB_OUTPUT"
          fi

  live-nas:
    needs: route
    if: needs.route.outputs.live == 'true' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, nas]
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
      - name: Install verified yt-dlp 2026.08.19
        env:
          YTDLP_BIN: ${{ runner.temp }}/yt-dlp
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp_linux \
            --output "$YTDLP_BIN"
          printf '%s  %s\n' \
            58162f9bfdc27458ea47bfcb311cf47028f17d8154a8bf7d689861d46399230a \
            "$YTDLP_BIN" | sha256sum -c -
          chmod +x "$YTDLP_BIN"
          "$YTDLP_BIN" --version
      - name: Probe search directly
        env:
          YTDLP_BIN: ${{ runner.temp }}/yt-dlp
        run: |
          "$YTDLP_BIN" --skip-download --dump-json --no-warnings \
            -f bestaudio "ytsearch:Rick Astley - Never Gonna Give You Up" \
            > "$RUNNER_TEMP/yt-dlp-probe.json"
          head -c 300 "$RUNNER_TEMP/yt-dlp-probe.json"
          echo
      - name: Live stream test
        env:
          QMIX_STREAM_LIVE: "1"
          QMIX_YTDLP_BIN: ${{ runner.temp }}/yt-dlp
        run: go test -run 'Live' ./internal/stream/...

  result:
    if: always()
    needs: [route, live-nas]
    runs-on: ubuntu-latest
    steps:
      - name: Verify routing
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          ROUTE_OUTPUT: ${{ needs.route.outputs.live }}
          REF: ${{ github.ref }}
          LIVE_RESULT: ${{ needs.live-nas.result }}
        run: |
          [[ "$ROUTE_RESULT" == success ]]
          if [[ "$ROUTE_OUTPUT" == true && "$REF" == refs/heads/main ]]; then
            [[ "$LIVE_RESULT" == success ]]
          elif [[ "$ROUTE_OUTPUT" == false || "$REF" != refs/heads/main ]]; then
            [[ "$LIVE_RESULT" == skipped ]]
          else
            exit 1
          fi
