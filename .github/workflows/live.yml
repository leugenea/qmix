# Live YouTube smoke from the deploy environment (qmix#18).
#
# Runs on the self-hosted runner labeled "nas" (home IP), where real yt-dlp
# requests to YouTube are possible. A separate file (not ci.yml) so the main
# pipeline never queues on the NAS being offline: this workflow is triggered
# manually (workflow_dispatch), weekly on schedule, on every push to main,
# and on pull requests (same checks as on main, qmix#20). It never blocks
# the main CI (continue-on-error) — same policy as the integration job; a
# stalled run (NAS offline) only affects this workflow, never the main
# pipeline's green signal. The -race flag is intentionally omitted: the
# race gate lives in ci.yml on ubuntu-latest, and the runner host may lack
# a C toolchain.
name: live

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC (09:00 MSK)
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      live: ${{ steps.paths.outputs.live }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: paths
        name: Route changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == workflow_dispatch || "${{ github.event_name }}" == schedule ]]; then
            printf 'live=true\n' >> "$GITHUB_OUTPUT"
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            printf 'ci=true\nandroid=true\nlive=true\n' >> "$GITHUB_OUTPUT"
          elif git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"; then
            python3 .github/scripts/workflow_paths.py \
              < "$RUNNER_TEMP/changed-paths" >> "$GITHUB_OUTPUT"
          else
            printf 'ci=true\nandroid=true\nlive=true\n' >> "$GITHUB_OUTPUT"
          fi

  live-nas:
    needs: route
    if: needs.route.outputs.live == 'true'
    runs-on: [self-hosted, nas]
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
      - name: Install latest yt-dlp standalone build
        run: |
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          # Always fetch the freshest standalone build: YouTube breaks old
          # extractors regularly, and the live smoke must distinguish
          # extractor breakage from qmix breakage. The standalone binary
          # does not depend on the runner's python version (pip resolved
          # to an outdated 2024.10.22 release on this runner).
          curl -fsSL \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux \
            -o "$HOME/.local/bin/yt-dlp"
          chmod +x "$HOME/.local/bin/yt-dlp"
          yt-dlp --version
      - name: Probe search directly (visible stderr)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          yt-dlp --skip-download --dump-json --no-warnings \
            -f bestaudio "ytsearch:Rick Astley - Never Gonna Give You Up" \
            | head -c 300
          echo
          echo "probe rc=${PIPESTATUS[0]}"
      - name: Live stream test (real YouTube from home IP)
        env:
          QMIX_STREAM_LIVE: "1"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          go test -run 'Live' ./internal/stream/...

  result:
    if: always()
    needs: [route, live-nas]
    runs-on: ubuntu-latest
    steps:
      - name: Verify routing
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          ROUTE_OUTPUT: ${{ needs.route.outputs.live }}
          LIVE_RESULT: ${{ needs.live-nas.result }}
        run: |
          [[ "$ROUTE_RESULT" == success ]]
          if [[ "$ROUTE_OUTPUT" == true ]]; then
            [[ "$LIVE_RESULT" == success ]]
          elif [[ "$ROUTE_OUTPUT" == false ]]; then
            [[ "$LIVE_RESULT" == skipped ]]
          else
            exit 1
          fi
