version: 2

updates:
  - package-ecosystem: "github-actions"
    # SHA-pinned Actions do not receive Dependabot alerts or security-update PRs;
    # this weekly version-update scan is the automated Actions update path.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(actions)"
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
